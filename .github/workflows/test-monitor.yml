name: Test Telegram Monitor

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Test monitor import
        run: |
          python - <<'PY'
          import auto_monitor

          print("IMPORT OK")
          print("Source channels:", auto_monitor.source_channels)
          print("Target:", auto_monitor.target_channel)
          print("Check interval:", auto_monitor.CHECK_INTERVAL)

          required = [
              "get_posts",
              "detect_post",
              "publish_post",
              "confirm_destination",
              "initialize_state",
              "monitor",
          ]

          for name in required:
              assert hasattr(auto_monitor, name), f"Missing: {name}"
              print("FOUND:", name)

          print("ALL CHECKS PASSED")
          PY
